name: Desktop app

# Builds the Windows installer and the macOS disk images on their own
# platforms. Run it from the Actions tab, or push a tag such as v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run desktop:dist
        env:
          # No signing certificates are configured yet; see the README.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: scribe-${{ runner.os }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.exe
          if-no-files-found: error
